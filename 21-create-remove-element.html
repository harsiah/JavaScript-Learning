<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM todoLIST</title>
    <style>

    </style>
</head>
<body>
    <h2>Daftar Tugas</h2>
    <input id="taskInput" type="text" placeholder="masukan tugas..">
    <button id="addBtn">Tambah Tugas</button>

    <ul id="taskList"></ul>

    

    <script>
        const taskInput = document.getElementById("taskInput");
        const addBtn = document.getElementById("addBtn");
        const taskList = document.getElementById("taskList");

        addBtn.addEventListener("click", function(){
            const taskText = taskInput.value.trim();
            if (taskText ===  ""){
                alert("tugas tidak boleh kosong!");
                return;
            }

            //membuat element li
            const li = document.createElement("li");
            //mengisi text element
            li.textContent = taskText + " ";
            //membuat tombol hapus
            const deleteBtn = document.createElement("button");
            deleteBtn.textContent = "hapus";

            //menambahkan event hapus
            deleteBtn.addEventListener("click", function(){
                li.remove();
            });

            //memasukan tombol kedalam li
            li.appendChild( deleteBtn);

            //manambahkan li kedaftar
            taskList.appendChild(li);
            
            //mengosongkan input
            taskInput.value = "";





        });





    </script>
</body>
</html>
