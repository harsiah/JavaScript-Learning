<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>belajar DOM</h1>
    <P id="message">Hello saya sedang belajar javascript!</P>
    <button id="tombol">ubah tombol</button>



    <script>
        const message = document.getElementById("message");
        const tombol = document.getElementById("tombol");

        tombol.addEventListener("click", function(){
            message.textContent = "kamu berhasil mengubah text";

        });

    </script>
</body>
</html>
