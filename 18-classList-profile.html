<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice DOM classList</title>
    <style>
        body {
            font-family: Arial,  sans-serif;
            text-align: center;
            padding: 40px;
        }

        .card {
            padding: 20px;
            margin: 20px auto;
            max-width: 300px;
            border: 2px solid #ccc;
            background-color: green;
            transition: 0.3s;
        }

        .highlight {
            background-color: lightblue;
            border-color: blue;
            transform: scale(1.3);
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
            
        }

        #addBtn {
            background-color: aqua;
            border-radius: 5px;
        }

        #removedBtn {
            background-color: cadetblue;
            border-radius: 5px;
        }
        #toggleBtn {
            background-color: chartreuse;
            border-radius: 5px;
        }

    </style>
</head>
<body>
    <div id="profile" class="card">
    <h2>Harsiah</h2>
    <p>Mahasiswa Sistem Information</p>
    </div>

    <button id="addBtn">Add Style</button>
    <button id="removedBtn">Remove</button>
    <button id="toggleBtn">Toggle Style</button>

    <script>

        const profile = document.getElementById("profile");
        const addBtn = document.getElementById("addBtn");
        const removedBtn = document.getElementById("removedBtn");
        const toggleBtn = document.getElementById("toggleBtn");

        //menambahkan class
        addBtn.addEventListener("click", function(){
            profile.classList.add("highlight")
        });

        //menghapus class

        removedBtn.addEventListener("click", function(){
            profile.classList.remove("highlight")
        });

        //mengaktifkan dan menonaktifkan class
        toggleBtn.addEventListener("click", function(){
            profile.classList.toggle("highlight")
        });

        

    </script>


    
</body>
</html>
