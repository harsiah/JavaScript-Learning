<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>belajar DOM2</title>
</head>
<body>
    <h1>belajar DOM2</h1>
    <input id="inputName" type="text" placeholder="masukan nama kamu...">
    <button id="tombol">sapa saya</button>
    <p id="message">sapaan akan muncul disini.</p>
    <button id="tombolWarna">ubah warna text</button>

    <script>
        const inputName = document.getElementById("inputName");
        const tombol = document.getElementById("tombol");
        const message = document.getElementById("message")
        const tombolWarna = document.getElementById("tombolWarna");

        tombol.addEventListener("click", function(){
            const name = inputName.value.trim();
            //trim berfungsi menghapus space di awal dan akhir text
            if (name === ""){
                message.textContent = "nama tidak boleh kosong!";
            } else {
                message.textContent = "hallo, " + name + "!";
                message.style.color = "red";

                
            }

        })

        //tombol ubah warna

        tombolWarna.addEventListener("click", function(){
          
                if (message.style.color === "yellow") {
                    message.style.color = "blue";
                } else {
                    message.style.color = "green"}
        });
    </script>
</body>
</html>
