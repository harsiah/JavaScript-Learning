  <body>
    <script>

        //latihan map1//
      const numbers = [5, 10, 15, 20, 25];
      const newNumbers = numbers.map((number) => {
        return number * 3;
      });

      console.log(newNumbers);

      //latihan map2//

      const products = [
        {name: "keyboard", price: 450000 },
        {name: "laptop", price: 7000000},
        {name: "mouse", price: 250000},
      ];
      const productNames = products.map(product => {
        return product.name;
      });

      console.log(productNames);

      //latihan map3//
      const prices = [75000, 35000, 7500000];
      const newPrices = prices.map(price => {

        return price * 2;
      });

      console.log(newPrices);

      //latihan filter1//
      const number = [5, 10, 15, 20, 25];
      const result = number.filter(number => {
        return number > 10;
      });

      console.log(result);

      //latihan filter2//
      const products1 = [
        {name: "keyboard", price: 450000 },
        {name: "laptop", price: 7000000},
        {name: "mouse", price: 250000},
      ];

      const expensiveProduts = products1.filter(product => {
        return product.price >= 450000;
      });

      console.log(expensiveProduts);

      //latiahan filter3//
      const numbers1 = [10, 15, 20, 25, 30, 35, 40];
      const bigNumbers = numbers1.filter (number => {
        return number > 20;
      });
      console.log(bigNumbers);

      //latihan filter4//
      const students = [
        {name: "John", score: 85},
        {name: "Jane", score: 60},
        {name: "Bob", score: 90},
        {name: "Alice", score: 70},
        {name: "Tom", score: 55},
      ];
      const passedSudents = students.filter (student => {
        return student.score >=75;
      });
      console.log(passedSudents);

      //latihan forEach1//
      const numbers3 = [10, 20, 30, 40, 50];
      numbers3.forEach(number  => {
        console.log(number);
      });

      //latihan forEach2//
      const numbers4 = [10, 20, 30, 40, 50];
      numbers4.forEach((number, index) => {
        console.log(number, index);
      });

      //latihan forEach3//
      const products2 = [
        {name: "keyboard", price: 450000 },
        {name: "laptop", price: 7000000},
        {name: "mouse", price: 250000},
      ];
      products2.forEach(product => {
        console.log("name: ", product.name);
        console.log("price: ", product.price);
      });

      //latihan forEach4//
      const fruits = ["apple", "banana", "orange", "grape"];
      fruits.forEach((fruit, index) => {
        console.log(fruit, index);
      });

      //latihan find//
      const numbers5 = [10, 20, 30, 40, 50];
      const result1 = numbers5.find(number => {
        return number >25;
      });
      console.log(result1);

      //latihan find menggunakan objek//
      const products3 = [
        {id: 1, name: "keyboard", price: 450000 },
        {id: 2, name: "laptop", price: 7000000},
        {id: 3, name: "mouse", price: 250000},
      ];
      const selectedProduct = products3.find(product => {
        return product.id === 2;
      });
      console.log(selectedProduct);

      //latihan find menggunakan object//
      const students1 = [
        {id: 1, name: "John", score: 85},
        {id: 2, name: "Jane", score: 60},
        {id: 3, name: "Bob", score: 90},
        {id: 4, name: "Alice", score: 70},
        {id: 5, name: "Tom", score: 55},
      ];
      const selectedStudent = students1.find(student => {
        return student.id === 3;
      });
      console.log(selectedStudent);

      //latihan findIndex//
        const numbers6 = [10, 20, 30, 40, 50];
        const result2 = numbers6.findIndex(number => {
            return number >25;
        });
        console.log(result2);


        //latihan findIndex menggunakan object//
        const products4 = [
            {id: 1, name: "keyboard", price: 450000 },
            {id: 2, name: "laptop", price: 7000000},
            {id: 3, name: "mouse", price: 250000},
        ];

        const productIndex = products4.findIndex(product => {
            return product.id === 3;
        });
        console.log(productIndex);

        //array method some//
        const numbers7 = [10, 20, 30, 40, 50];
        const result3 = numbers7.some(number => {
            return number > 40;
        });

        console.log(result3);

        //array method every//
        const numbers8 = [10, 20, 30, 40, 50];
        const result4 = numbers8.every(number => {
            return number > 5;
        });
        console.log(result4);

        //array method every menggunakan object//
        const students2 = [
            {id: 1, name: "John", score: 85},
            {id: 2, name: "Jane", score: 80},
            {id: 3, name: "Bob", score: 90},
            {id: 4, name: "Alice", score: 70},
            {id: 5, name: "Tom", score: 75},
        ];
        const allPassed = students2.every(student => {
          return student.score >= 70;
        });
        console.log(allPassed);

        //array method some//
        const products5 = [
            {id: 1, name: "keyboard", price: 450000 },
            {id: 2, name: "laptop", price: 7000000},
            {id: 3, name: "mouse", price: 250000},
        ];
        const hasExpensiveProduct = products5.some(product => {
          return product.price > 5000000;
        });
        console.log(hasExpensiveProduct);

        //array method reduce//
        const numbers9 = [10, 20, 30, 40, 50];
        const total = numbers9.reduce((accumulator, number) => {
          return accumulator + number;
        }, 0);
        console.log(total);

        //array method reduce menggunakan object//
        const products6 = [
            {id: 1, name: "keyboard", price: 450000 },
            {id: 2, name: "laptop", price: 7000000},
            {id: 3, name: "mouse", price: 250000},
        ];
        const totalPrice = products6.reduce((total, product) => {
          return total + product.price;

        }, 0);
        console.log(totalPrice);

        //latihan reduce menggunakan number//
        const prices1 = [1000, 2000, 3000, 4000, 5000];
        const totalPrice1 = prices1.reduce((total, price) => {
          return total + price;
        }, 0);
      console.log(totalPrice1);

      //array method sort//
      const numbers10 = [40, 10, 30, 20, 50];
      const sortedNumbers = numbers10.sort((a, b) => {
        return a - b;
      });
      console.log(sortedNumbers);

      //array method sort urutkan dari kecil ke besar//
      const numbers11 = [10, 3, 5, 1, 4, 2];
      numbers11.sort((a, b) => a - b);
      console.log(numbers11);

      //array method sort urutkan dari besar ke kecil//
      const numbers12 = [10, 3, 5, 1, 4, 2];
      numbers12.sort((a, b) => b - a);
      console.log(numbers12);

      //array method sort menggunakan object//
      const products7 = [
        {id: 1, name: "keyboard", price: 5000000 },
        {id: 2, name: "laptop", price: 3000000},
        {id: 3, name: "mouse", price: 200000},
      ];
      const sortedProducts = products.sort((a,b) => {
        return b.price - a.price;
      });
      console.log(sortedProducts);

      //array method slice//
      const fruits5 = ["apple", "banana", "orange", "grape", "kiwi"];
      const resultfruit = fruits5.slice(1, 4);
      console.log(resultfruit);

      //array method slice//
      const electronics = ["keyboard", "laptop", "mouse", "monitor", "headset"]
      const resultElectronic = electronics.slice(2,4);
      console.log(resultElectronic);


      //array method splice//
      const fruits2 = ["apple", "banana", "orange", "grape", "kiwi"];
      fruits2.splice(1, 2);
      console.log(fruits2);

      //array method splice menambah  data////
      const fruits3 = ["Apple", "Banana", "grape"];
      fruits3.splice(2,0, "orange");
      console.log(fruits3);

      //array method splice untuk mengganti data//
      const fruits4 = ["apple", "banana", "manggo"];
      fruits4.splice(1,1, "orange");
      console.log(fruits4);

      //array method concat dan join //
      const freshFruits1 = ["apple", "anggur"];
      const freshFruits2 = ["banana", "mango"];
      const allfruits = freshFruits1.concat(freshFruits2);
      console.log(allfruits);

      const phone1 = ["iphone", "oppo"];
      const phone2 = ["advan", "reno5"];
      const phone3 = ["redmi", "huawei"];
      const allphones = phone1.concat(phone2,phone3);
      console.log(allphones);

      const animals = ["anjing", "kucing", "sapi"];
      const animalReslut = animals.join();
      console.log(animalReslut);




    </script>
